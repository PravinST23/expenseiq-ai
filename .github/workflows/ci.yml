name: ExpenseIQ CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    name: Backend - tests & coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: expenseiq_test
          POSTGRES_USER: expenseiq_user
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U expenseiq_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Tesseract OCR
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write CI .env
        run: |
          cat > .env <<'EOF'
          APP_NAME=ExpenseIQ API
          APP_VERSION=1.0.0
          APP_DESCRIPTION=Enterprise AI Expense Management Platform
          HOST=127.0.0.1
          PORT=8000
          DEBUG=False
          POSTGRES_HOST=localhost
          POSTGRES_PORT=5432
          POSTGRES_DATABASE=expenseiq_test
          POSTGRES_USER=expenseiq_user
          POSTGRES_PASSWORD=ci_password
          GEMINI_API_KEY=ci-placeholder
          GROQ_API_KEY=ci-placeholder
          OLLAMA_HOST=http://localhost:11434
          OLLAMA_MODEL=llava
          CORS_ORIGINS_RAW=http://localhost:5173
          JWT_SECRET_KEY=ci-test-secret-not-for-production
          JWT_ALGORITHM=HS256
          JWT_EXPIRE_MINUTES=60
          EOF

      - name: Run database migrations
        run: alembic upgrade head

      - name: Run tests with coverage
        run: |
          pytest --cov=app --cov-report=term-missing --cov-report=xml -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend:
    name: Frontend - lint & build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
